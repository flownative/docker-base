name: Build Docker images
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: "Build base image with Bookworm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'bookworm'
          fetch-depth: 100

      - name: Determine latest version
        id: latest_version
        uses: flownative/action-git-latest-release@v1

      - run: |
          sudo chmod -R ugo+rwX . && shopt -s dotglob && rm -rf *

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest_version.outputs.tag }}
          fetch-depth: 100

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            flownative/base
            harbor.flownative.io/docker/base
          labels: |
            org.opencontainers.image.title=Flownative Base Image
            org.opencontainers.image.description=The base for most Docker images by Flownative
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Flownative GmbH
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,bookworm

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_PASSWORD }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.flownative.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Send mail for Opsgenie heartbeat
        uses: dawidd6/action-send-mail@v3
        with:
          connection_url: ${{secrets.OPSGENIE_HEARTBEAT_MAIL_CREDENTIALS}}
          subject: Github Actions heartbeat ping
          to: docker-build-base@flownative.heartbeat.eu.opsgenie.net
          from: Github Actions <noreply@flownative.com>
          body: Build job of ${{github.repository}} completed successfully!

      - name: Push heartbeat metric to Grafana Cloud
        if: success()
        env:
          RW_URL: ${{ secrets.GRAFANA_METRICS_RW_URL }}
          INSTANCE_ID: ${{ secrets.GRAFANA_METRICS_INSTANCE_ID }}
          TOKEN: ${{ secrets.GRAFANA_METRICS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # Derive the Influx line-protocol push endpoint from the Prometheus
          # remote-write endpoint (same account, different host/path).
          INFLUX_URL="$(printf '%s' "$RW_URL" | sed -e 's#prometheus-#influx-#' -e 's#/api/prom/push#/api/v1/push/influx/write#')"
          NOW="$(date +%s)"
          # measurement + field 'seconds' -> metric flownative_ci_last_success_timestamp_seconds
          curl -sf --retry 3 --retry-all-errors \
            -u "${INSTANCE_ID}:${TOKEN}" \
            -H 'Content-Type: text/plain' \
            "${INFLUX_URL}" \
            --data-binary "flownative_ci_last_success_timestamp,job=docker-build,image=base seconds=${NOW}"
